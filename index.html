                      className="w-full bg-metal-800 border border-stone-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-400"
                    ></textarea>
                  </div>

                  {/* Custom Note */}
                  <div>
                    <label className="block text-stone-300 font-semibold mb-1">
                      বিশেষ নির্দেশনা / খোদাই রিকোয়ারমেন্ট (যদি থাকে):
                    </label>
                    <input 
                      type="text" 
                      placeholder="যেমন: উপহার দেব, সুন্দর গিফট প্যাকিং লাগবে"
                      value={customNote}
                      onChange={e => setCustomNote(e.target.value)}
                      className="w-full bg-metal-800 border border-stone-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-400"
                    />
                  </div>

                  {/* Price Summary Calculation */}
                  <div className="p-3 rounded-xl bg-metal-950 border border-amber-500/30 space-y-1.5">
                    <div className="flex justify-between text-stone-400">
                      <span>পণ্যের মূল্য:</span>
                      <span className="font-semibold text-white">৳{orderModalProduct.price.toLocaleString('en-IN')}</span>
                    </div>
                    <div className="flex justify-between text-stone-400">
                      <span>কুরিয়ার ও হ্যান্ডলিং ফি:</span>
                      <span className="font-semibold text-amber-400">
                        ৳{deliveryCharge}
                      </span>
                    </div>
                    <div className="flex justify-between text-sm font-bold text-amber-400 border-t border-stone-800 pt-1.5">
                      <span>সর্বমোট প্রদেয়:</span>
                      <span className="font-cinzel text-base">
                        ৳{(orderModalProduct.price + deliveryCharge).toLocaleString('en-IN')}
                      </span>
                    </div>
                  </div>

                  {/* Submit Button */}
                  <button
                    type="submit"
                    className="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-extrabold text-sm shadow-xl shadow-emerald-950/50 transition flex items-center justify-center gap-2"
                  >
                    <span>💬 WhatsApp-এ অর্ডার নিশ্চিত করুন</span>
                    <span>➔</span>
                  </button>

                  <p className="text-[10px] text-center text-stone-400">
                    🔒 ক্যাশ অন ডেলিভারি • ডেলিভারিম্যানের সামনে পণ্য যাচাই করে মূল্য পরিশোধ করতে পারবেন।
                  </p>

                </form>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
